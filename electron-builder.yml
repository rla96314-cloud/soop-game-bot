appId: com.soop.gamebot
productName: SOOP Game Bot
copyright: Copyright © 2025

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: "soop-game-bot-setup-${version}.exe"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.png
  artifactName: "soop-game-bot-${version}-${arch}.dmg"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SOOP Game Bot
  license: null

# 자동 업데이트(electron-updater)는 쓰지 않음 — publish 설정은 플레이스홀더였으므로 제거. GitHub Release 는 workflow 가 올린다.
publish: null
